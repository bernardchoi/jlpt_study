<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字源 — 한자 분해·부수 뜻 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE4D3;
    --paper-light: #F3EEE1;
    --paper-line: #C9BEA0;
    --ink: #22201B;
    --ink-soft: #6B6455;
    --ink-faint: #9A9280;
    --shu: #B23A2E;
    --shu-soft: #E7C9BF;
    --gold: #9C7A2A;
    --indigo: #3E5C76;
    --green: #3C7A3C;
    --green-soft: #E4F1E1;
    --radius-s: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(34,32,27,0.05) 27px, rgba(34,32,27,0.05) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(34,32,27,0.05) 27px, rgba(34,32,27,0.05) 28px);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    gap:18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }
  .logo{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size: 44px;
    letter-spacing: 2px;
    color: var(--ink);
    line-height:1;
  }
  .headline{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .headline h1{
    margin:0;
    font-size:17px;
    font-weight:700;
  }
  .headline p{
    margin:0;
    font-size:13px;
    color: var(--ink-soft);
  }
  .status-line{
    font-size:12px;
    color: var(--ink-faint);
    margin-bottom: 22px;
    min-height: 16px;
  }
  form.search{
    display:flex;
    gap:10px;
    margin-bottom: 8px;
  }
  input[type=text]{
    flex:1;
    min-width:0;
    font-family:'Noto Serif JP','Noto Sans KR',serif;
    font-size: 20px;
    padding: 12px 14px;
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-s);
    background: var(--paper-light);
    color: var(--ink);
  }
  input[type=text]:focus{
    outline: none;
    border-color: var(--shu);
    box-shadow: 0 0 0 2px var(--shu-soft);
  }
  button.go{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size: 14px;
    padding: 0 22px;
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-s);
    background: var(--ink);
    color: var(--paper-light);
    cursor: pointer;
  }
  button.go:hover{ background: var(--shu); border-color: var(--shu); }
  .hint{ font-size:12px; color: var(--ink-faint); margin-bottom: 40px; }

  .empty-state{
    padding: 40px 0;
    color: var(--ink-soft);
    font-size: 14px;
    border-top: 1px dashed var(--paper-line);
  }

  .jlpt-filter{ margin-bottom: 36px; }
  .jlpt-filter-label{ font-size:12px; color: var(--ink-faint); margin-bottom:8px; }
  .jlpt-buttons{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .jlpt-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:6px 14px;
    border:1.5px solid var(--ink);
    border-radius: 14px;
    background: var(--paper-light);
    color: var(--ink);
    cursor:pointer;
  }
  .jlpt-btn:hover{ border-color: var(--shu); color: var(--shu); }
  .jlpt-btn.active{ background: var(--ink); color: var(--paper-light); }
  .jlpt-count{ font-weight:400; color: var(--ink-faint); margin-left:4px; }
  .jlpt-btn.active .jlpt-count{ color: var(--paper-line); }
  .jlpt-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    max-height: 260px;
    overflow-y: auto;
    padding: 10px;
  }
  .jlpt-grid:not(:empty){
    border: 1px solid var(--paper-line);
    background: rgba(255,255,255,0.35);
    border-radius: var(--radius-s);
  }
  .jlpt-char{
    width:38px; height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Noto Serif JP', serif;
    font-size:19px;
    border:1px solid var(--paper-line);
    border-radius: var(--radius-s);
    background: var(--paper-light);
    color: var(--ink);
    cursor:pointer;
  }
  .jlpt-char:hover{ border-color: var(--shu); color: var(--shu); }

  .bookmark-bar{ margin-bottom: 24px; }
  .bookmark-toggle{ border-color: var(--gold); color: var(--gold); }
  .bookmark-toggle:hover{ background: var(--gold); color:#fff; }
  .bookmark-toggle.active{ background: var(--gold); color:#fff; }
  .bookmark-toggle.active .jlpt-count{ color: #fff2d4; }

  .quiz-bar{ margin-bottom: 36px; }
  .quiz-toggle{ border-color: var(--indigo); color: var(--indigo); }
  .quiz-toggle:hover{ background: var(--indigo); color:#fff; }
  .quiz-toggle.active{ background: var(--indigo); color:#fff; }

  .quiz-panel:empty{ display:none; }
  .quiz-panel:not(:empty){
    margin-top:12px;
    padding: 22px;
    border: 1px solid var(--paper-line);
    background: rgba(255,255,255,0.35);
    border-radius: var(--radius-s);
  }
  .quiz-setup-label{ font-size:13px; color: var(--ink-soft); margin-bottom:12px; }
  .quiz-source-buttons{ display:flex; flex-wrap:wrap; gap:8px; }
  .quiz-source-buttons .jlpt-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .quiz-source-buttons .jlpt-btn:disabled:hover{ background:none; color: var(--ink); border-color: var(--ink); }

  .quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; }
  .quiz-progress{ font-size:12px; color: var(--ink-faint); }
  .quiz-quit-btn{
    font-size:11.5px;
    color: var(--ink-faint);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .quiz-quit-btn:hover{ color: var(--shu); }
  .quiz-question{ display:flex; justify-content:center; margin-bottom:22px; }
  .quiz-choices{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .quiz-choice{
    font-family:'Noto Sans KR', sans-serif;
    font-size:14px;
    text-align:left;
    padding:10px 14px;
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-s);
    background: var(--paper-light);
    color: var(--ink);
    cursor:pointer;
  }
  .quiz-choice:hover:not(:disabled){ border-color: var(--indigo); color: var(--indigo); }
  .quiz-choice:disabled{ cursor:default; }
  .quiz-choice.correct{ border-color: var(--green); background: var(--green-soft); color: var(--green); }
  .quiz-choice.wrong{ border-color: var(--shu); background: var(--shu-soft); color: var(--shu); }
  .quiz-next-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:8px 18px;
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-s);
    background: var(--ink);
    color: var(--paper-light);
    cursor:pointer;
  }
  .quiz-next-btn:hover{ background: var(--indigo); border-color: var(--indigo); }
  .quiz-result{ font-size:19px; font-weight:700; margin-bottom:16px; }
  .quiz-result-actions{ display:flex; flex-wrap:wrap; gap:8px; }

  .card{
    border-top: 1px solid var(--paper-line);
    padding: 32px 0;
  }
  .card:first-of-type{ border-top:none; }

  .hero{
    position:relative;
    display:flex;
    gap: 22px;
    align-items:flex-start;
    margin-bottom: 22px;
  }
  .bookmark-btn{
    position:absolute;
    top:0; right:0;
    width:30px; height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:1;
    border: 1px solid var(--paper-line);
    border-radius: 50%;
    background: var(--paper-light);
    color: var(--ink-faint);
    cursor:pointer;
  }
  .bookmark-btn:hover{ border-color: var(--gold); color: var(--gold); }
  .bookmark-btn.active{ border-color: var(--gold); color: var(--gold); background: #FBF1DA; }
  .cell{
    position:relative;
    width: 108px;
    height: 108px;
    min-width:108px;
    border: 1.5px solid var(--ink);
    background: var(--paper-light);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cell::before, .cell::after{
    content:'';
    position:absolute;
    border-style:dashed;
    border-color: var(--paper-line);
  }
  .cell::before{ left:50%; top:6px; bottom:6px; border-left-width:1px; }
  .cell::after{ top:50%; left:6px; right:6px; border-top-width:1px; }
  .cell .glyph{
    position:relative;
    z-index:1;
    font-family:'Noto Serif JP', serif;
    font-size: 62px;
    line-height:1;
  }
  .cell.small{ width:56px; height:56px; min-width:56px; }
  .cell.small .glyph{ font-size:30px; }
  .cell.stamp{ border-color: var(--shu); }

  .meta{ flex:1; min-width:0; }
  .meta .row{ margin-bottom:6px; font-size:14px; }
  .meta .label{ color: var(--ink-faint); font-size:11px; margin-right:8px; }
  .meta .meanings{ font-size:15px; font-weight:500; }
  .meta .readings{ font-size:13.5px; color: var(--ink-soft); }
  .tag{
    display:inline-block;
    font-size:11px;
    padding:1px 7px;
    border:1px solid var(--ink-faint);
    border-radius: 10px;
    color: var(--ink-soft);
    margin-right:6px;
  }
  .loading-text{ color: var(--ink-faint); font-style:italic; }
  .error-text{ color: var(--shu); }

  .section-title{
    font-size:12px;
    color: var(--ink-faint);
    margin: 18px 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{
    content:'';
    flex:1;
    height:1px;
    background: var(--paper-line);
  }
  .atomic-note{
    font-size:13px;
    color: var(--ink-soft);
    padding: 6px 0;
  }

  .word-list{ display:flex; flex-direction:column; gap:8px; }
  .word-item{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:4px 10px;
    padding:8px 12px;
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-s);
    background: var(--paper-light);
  }
  .word-text{
    font-family:'Noto Serif JP', serif;
    font-size:17px;
    font-weight:600;
    color: var(--ink);
  }
  .word-hl{ color: var(--shu); }
  .word-reading{ font-size:12.5px; color: var(--ink-soft); }
  .word-meaning{ font-size:13px; color: var(--ink-soft); margin-left:auto; }

  .tree{ display:flex; flex-wrap:wrap; align-items:flex-start; gap: 18px; }
  .op-block{ display:flex; flex-direction:column; align-items:center; }
  .op-label{
    font-size:10.5px;
    color: var(--gold);
    margin-bottom:6px;
    white-space:nowrap;
  }
  .op-children{ display:flex; gap:14px; flex-wrap:wrap; }
  .op-children.col{ flex-direction:column; align-items:center; }
  .op-children.row{ flex-direction:row; align-items:flex-start; justify-content:center; }

  .leaf-block{ display:flex; flex-direction:column; align-items:center; gap:6px; width:104px; }
  .leaf-meaning{
    font-size:11.5px;
    text-align:center;
    color: var(--ink-soft);
    min-height: 14px;
  }
  .leaf-meaning .hun{ color: var(--shu); font-weight:500; }
  .radbadge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--shu);
    color:#fff;
    font-size:9px;
    margin-right:4px;
    line-height:1;
  }
  .expand-btn{
    font-size:10.5px;
    color: var(--gold);
    background:none;
    border:1px dashed var(--gold);
    border-radius: 10px;
    padding:2px 8px;
    cursor:pointer;
    margin-top:2px;
  }
  .expand-btn:hover{ background: var(--gold); color:#fff; }

  footer{
    margin-top: 60px;
    padding-top: 16px;
    border-top: 1px solid var(--paper-line);
    font-size: 11.5px;
    color: var(--ink-faint);
  }
  footer a{ color: var(--ink-soft); }

  @media (max-width:520px){
    .cell{ width:84px; height:84px; min-width:84px; }
    .cell .glyph{ font-size:46px; }
    .hero{ gap:14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">字源</div>
    <div class="headline">
      <h1>한자 분해·부수 뜻 사전</h1>
      <p>한자 입력 → 구성 요소 분해 → 부수·구성자 뜻 확인</p>
    </div>
  </header>

  <div id="status" class="status-line">부수 분해 데이터 불러오는 중…</div>

  <form class="search" id="searchForm">
    <input type="text" id="kanjiInput" placeholder="한자 입력. 예: 語" autocomplete="off">
    <button class="go" type="submit">분해</button>
  </form>
  <div class="hint">여러 글자 입력 시 글자별로 결과 나눠 표시함. 예: 語学</div>

  <div class="bookmark-bar">
    <button type="button" class="jlpt-btn bookmark-toggle" id="bookmarkToggleBtn">★ 즐겨찾기 <span class="jlpt-count" id="bookmarkCount">(0)</span></button>
    <div class="jlpt-grid" id="bookmarkGrid"></div>
  </div>

  <div class="jlpt-filter">
    <div class="jlpt-filter-label">JLPT 등급별로 찾아보기</div>
    <div class="jlpt-buttons" id="jlptButtons">
      <button type="button" class="jlpt-btn" data-level="5">N5</button>
      <button type="button" class="jlpt-btn" data-level="4">N4</button>
      <button type="button" class="jlpt-btn" data-level="3">N3</button>
      <button type="button" class="jlpt-btn" data-level="2">N2</button>
      <button type="button" class="jlpt-btn" data-level="1">N1</button>
    </div>
    <div class="jlpt-grid" id="jlptGrid"></div>
  </div>

  <div class="quiz-bar">
    <button type="button" class="jlpt-btn quiz-toggle" id="quizToggleBtn">🎓 학습 모드(퀴즈)</button>
    <div class="quiz-panel" id="quizPanel"></div>
  </div>

  <div id="results"></div>

  <footer>
    분해 구조(IDS) 출처: CHISE / cjkvi-ids 프로젝트 · 한자 뜻·음훈 출처: KANJIDIC 기반 kanji-data(davidluzgouveia) · 부수 214자 훈음: 자체 정리<br>
    모든 데이터는 이 페이지에 내장되어 있으며, 외부 서버·API 연결 없이 완전 오프라인으로 동작함.
  </footer>

</div>

<script>

    ["交差点","こうさてん","교차로"],
    ["赤","あか","빨강"],["青","あお","파랑"],["白","しろ","하양"],["黒","くろ","검정"],
    ["黄色","きいろ","노랑"],["緑","みどり","초록"],
    ["出発","しゅっぱつ","출발"],["到着","とうちゃく","도착"],["出席","しゅっせき","출석"],
    ["欠席","けっせき","결석"],["卒業","そつぎょう","졸업"],["入学","にゅうがく","입학"],
    ["結婚","けっこん","결혼"],["誕生","たんじょう","탄생"],["生活","せいかつ","생활"],
    ["練習","れんしゅう","연습"],["運動","うんどう","운동"],["散歩","さんぽ","산책"],
    ["旅館","りょかん","여관"],["空気","くうき","공기"]
  ];

  var wordIndex = new Map();
  WORDS_DATA.forEach(function(entry){
    var word = entry[0];
    Array.from(new Set(Array.from(word))).forEach(function(ch){
      if (!wordIndex.has(ch)) wordIndex.set(ch, []);
      wordIndex.get(ch).push(entry);
    });
  });
  function wordsContaining(ch){ return wordIndex.get(ch) || []; }

  // ---------- IDS(구성 분해 기술자) 처리 ----------
  var OPERATORS = { "⿰":2,"⿱":2,"⿲":3,"⿳":3,"⿴":2,"⿵":2,"⿶":2,"⿷":2,"⿸":2,"⿹":2,"⿺":2,"⿻":2 };
  var OP_META = {
    "⿰":{arrange:"row", label:"좌우 결합"},
    "⿱":{arrange:"col", label:"상하 결합"},
    "⿲":{arrange:"row", label:"좌·중·우 결합"},
    "⿳":{arrange:"col", label:"상·중·하 결합"},
    "⿴":{arrange:"row", label:"전체 감싸는 구조"},
    "⿵":{arrange:"col", label:"위에서 감싸는 구조"},
    "⿶":{arrange:"col", label:"아래에서 감싸는 구조"},
    "⿷":{arrange:"row", label:"왼쪽에서 감싸는 구조"},
    "⿸":{arrange:"row", label:"왼위에서 감싸는 구조"},
    "⿹":{arrange:"row", label:"오른위에서 감싸는 구조"},
    "⿺":{arrange:"row", label:"왼아래에서 감싸는 구조"},
    "⿻":{arrange:"row", label:"겹치는 구조"}
  };

  // 분해 구조(IDS) 내장 데이터: 상용/교육한자(약 3000자) 기준으로 실제 분해에
  // 필요한 구성자까지 전부 포함해 총 3400여 자 수록. 외부 네트워크 없이 동작.
  var idsMap = new Map(Object.entries(IDS_DATA));
  var idsReady = true;

  function tokenizeIds(str){ return Array.from(str); }

  function parseIdsString(str){
    var tokens = tokenizeIds(str);
    var pos = {i:0};
    function walk(){
      var ch = tokens[pos.i]; pos.i++;
      if (OPERATORS[ch]){
        var arity = OPERATORS[ch];
        var children = [];
        for (var k=0;k<arity;k++){ children.push(walk()); }
        return {type:"op", op:ch, children:children};
      }
      return {type:"leaf", char: ch};
    }
    return walk();
  }

  // subDepth: 이 글자 자체를 대신할 구성자 확장을 몇 단계까지 허용할지
  function expandChar(ch, subDepth, maxSubDepth, visited){
    var entry = idsMap.get(ch);
    if (!entry || entry === ch || visited.has(ch)){
      return {type:"leaf", char: ch, isRadical: !!radicalInfo(ch)};
    }
    var v2 = new Set(visited); v2.add(ch);
    var parsed = parseIdsString(entry);

    function processNode(n){
      if (n.type==="op"){
        return {type:"op", op:n.op, children:n.children.map(processNode)};
      }
      var c = n.char;
      var hasFurther = idsMap.has(c) && idsMap.get(c) !== c;
      var rad = !!radicalInfo(c);
      if (hasFurther && !rad && subDepth < maxSubDepth && !v2.has(c)){
        return expandChar(c, subDepth+1, maxSubDepth, v2);
      }
      return { type:"leaf", char:c, isRadical: rad, canExpandMore: hasFurther && !rad && subDepth>=maxSubDepth };
    }
    return processNode(parsed);
  }

  function isAtomic(ch){
    var entry = idsMap.get(ch);
    return !entry || entry === ch;
  }

  // ---------- 뜻/음훈 조회 (내장 데이터, KANJIDIC 기반) ----------
  function translateMeaning(word){
    return MEANING_KO[word] || word;
  }

  function fetchMeaning(ch){
    var raw = MEANINGS_DATA[ch];
    if (!raw) return Promise.resolve(null);
    var data = {
      meanings: (raw.m || []).map(translateMeaning),
      on_readings: raw.on || [],
      kun_readings: raw.kun || [],
      grade: raw.g || null,
      jlpt: raw.j || null,
      stroke_count: raw.s || null
    };
    return Promise.resolve(data);
  }

  // ---------- 렌더링 ----------
  var resultsEl = document.getElementById("results");
  var statusEl = document.getElementById("status");

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text!=null) e.textContent = text;
    return e;
  }

  function buildCell(ch, small, stamp){
    var cell = el("div","cell"+(small?" small":"")+(stamp?" stamp":""));
    var g = el("span","glyph",ch);
    cell.appendChild(g);
    return cell;
  }

  function fillMeaningInto(targetEl, ch, options){
    options = options||{};
    var loading = el("span","loading-text","뜻 불러오는 중");
    targetEl.appendChild(loading);
    fetchMeaning(ch).then(function(data){
      targetEl.innerHTML = "";
      var rad = radicalInfo(ch);
      if (rad && options.showRadicalBadge){
        var badge = el("span","radbadge", rad.no);
        targetEl.appendChild(badge);
        var hunSpan = el("span","hun", rad.hun);
        targetEl.appendChild(hunSpan);
        if (data && data.meanings && data.meanings.length){
          targetEl.appendChild(document.createTextNode(" · "+data.meanings.slice(0,2).join(", ")));
        }
        return;
      }
      if (rad){
        targetEl.appendChild(document.createTextNode(rad.hun));
        return;
      }
      if (data && data.meanings && data.meanings.length){
        targetEl.appendChild(document.createTextNode(data.meanings.slice(0,3).join(", ")));
      } else {
        targetEl.appendChild(el("span","error-text","뜻 정보 없음"));
      }
    });
  }

  function renderTreeNode(node){
    if (node.type==="leaf"){
      var block = el("div","leaf-block");
      var rad = node.isRadical;
      var cell = buildCell(node.char, true, rad);
      block.appendChild(cell);
      var meaning = el("div","leaf-meaning");
      block.appendChild(meaning);
      fillMeaningInto(meaning, node.char, {showRadicalBadge:true});
      if (node.canExpandMore){
        var btn = el("button","expand-btn","더 분해");
        btn.addEventListener("click", function(){
          var expanded = expandChar(node.char, 0, 1, new Set());
          var replacement = renderTreeNode(expanded);
          block.replaceWith(replacement);
        });
        block.appendChild(btn);
      }
      return block;
    }
    // op node
    var meta = OP_META[node.op] || {arrange:"row", label:node.op};
    var wrap = el("div","op-block");
    var label = el("div","op-label", meta.label);
    wrap.appendChild(label);
    var childrenWrap = el("div","op-children "+(meta.arrange==="col"?"col":"row"));
    node.children.forEach(function(c){
      childrenWrap.appendChild(renderTreeNode(c));
    });
    wrap.appendChild(childrenWrap);
    return wrap;
  }

  function buildCard(ch){
    var card = el("div","card");

    var hero = el("div","hero");
    hero.appendChild(buildCell(ch,false,false));

    var bmBtn = el("button","bookmark-btn","");
    bmBtn.type = "button";
    function refreshBmBtn(){
      var on = isBookmarked(ch);
      bmBtn.classList.toggle("active", on);
      bmBtn.textContent = on ? "★" : "☆";
      bmBtn.title = on ? "즐겨찾기 해제" : "즐겨찾기 추가";
    }
    refreshBmBtn();
    bmBtn.addEventListener("click", function(){
      toggleBookmark(ch);
      refreshBmBtn();
      refreshBookmarkBar();
    });
    hero.appendChild(bmBtn);

    var meta = el("div","meta");
    var meaningsRow = el("div","row meanings","");
    var readingsRow = el("div","row readings","");
    var tagsRow = el("div","row","");
    meta.appendChild(meaningsRow);
    meta.appendChild(readingsRow);
    meta.appendChild(tagsRow);
    hero.appendChild(meta);
    card.appendChild(hero);

    meaningsRow.appendChild(el("span","loading-text","뜻 불러오는 중"));

    fetchMeaning(ch).then(function(data){
      meaningsRow.innerHTML = "";
      readingsRow.innerHTML = "";
      tagsRow.innerHTML = "";
      var rad = radicalInfo(ch);
      if (rad){
        var badge = el("span","radbadge", rad.no);
        meaningsRow.appendChild(badge);
        meaningsRow.appendChild(document.createTextNode("부수 "+rad.no+"번 · "+rad.hun+"  "));
      }
      if (data && data.meanings && data.meanings.length){
        meaningsRow.appendChild(document.createTextNode(data.meanings.join(", ")));
      } else if (!rad){
        meaningsRow.appendChild(el("span","error-text","뜻 정보 없음(사전 미등재 글자 가능)"));
      }
      if (data){
        var readParts = [];
        if (data.on_readings && data.on_readings.length) readParts.push("음: "+data.on_readings.join("·"));
        if (data.kun_readings && data.kun_readings.length) readParts.push("훈: "+data.kun_readings.join("·"));
        readingsRow.textContent = readParts.join("   ");
        if (data.grade) tagsRow.appendChild(el("span","tag","교육 학년 "+data.grade));
        if (data.jlpt) tagsRow.appendChild(el("span","tag","JLPT N"+data.jlpt));
        if (data.stroke_count) tagsRow.appendChild(el("span","tag",data.stroke_count+"획"));
      }
    });

    // 분해 트리
    var sectionTitle = el("div","section-title","구성 분해");
    card.appendChild(sectionTitle);

    if (isAtomic(ch)){
      var note = el("div","atomic-note");
      var rad = radicalInfo(ch);
      note.textContent = rad
        ? "이 글자는 더 이상 쪼개지지 않는 기본 부수(부수 "+rad.no+"번, "+rad.hun+")임."
        : "이 글자는 더 이상 쪼개지지 않는 기본 구성 단위임.";
      card.appendChild(note);
    } else {
      var tree = expandChar(ch, 0, 1, new Set());
      var treeWrap = el("div","tree");
      treeWrap.appendChild(renderTreeNode(tree));
      card.appendChild(treeWrap);
    }

    // 예시 단어
    var wordSectionTitle = el("div","section-title","예문·단어");
    card.appendChild(wordSectionTitle);
    var words = wordsContaining(ch);
    if (!words.length){
      card.appendChild(el("div","atomic-note","등록된 예시 단어 없음."));
    } else {
      var wordList = el("div","word-list");
      words.forEach(function(entry){
        var item = el("div","word-item");
        var wordSpan = el("span","word-text");
        Array.from(entry[0]).forEach(function(c){
          if (c === ch) wordSpan.appendChild(el("span","word-hl", c));
          else wordSpan.appendChild(document.createTextNode(c));
        });
        item.appendChild(wordSpan);
        item.appendChild(el("span","word-reading", entry[1]));
        item.appendChild(el("span","word-meaning", entry[2]));
        wordList.appendChild(item);
      });
      card.appendChild(wordList);
    }

    return card;
  }

  function isCJK(ch){
    var cp = ch.codePointAt(0);
    return (cp>=0x3400 && cp<=0x9FFF) || (cp>=0x20000 && cp<=0x3FFFF) || (cp>=0xF900 && cp<=0xFAFF);
  }

  function runSearch(raw){
    resultsEl.innerHTML = "";
    if (!idsReady){
      resultsEl.appendChild(el("div","empty-state","분해 데이터 아직 준비 안 됨. 잠시 후 다시 시도 요망."));
      return;
    }
    var chars = Array.from(raw.trim()).filter(isCJK);
    if (!chars.length){
      resultsEl.appendChild(el("div","empty-state","한자 인식 안 됨. 한자를 직접 입력 요망."));
      return;
    }
    var seen = new Set();
    chars.forEach(function(ch){
      if (seen.has(ch)) return;
      seen.add(ch);
      resultsEl.appendChild(buildCard(ch));
    });
  }

  document.getElementById("searchForm").addEventListener("submit", function(e){
    e.preventDefault();
    var v = document.getElementById("kanjiInput").value;
    runSearch(v);
  });

  // ---------- JLPT 등급별 찾아보기 ----------
  var jlptIndex = { "5":[], "4":[], "3":[], "2":[], "1":[] };
  Object.keys(MEANINGS_DATA).forEach(function(ch){
    var d = MEANINGS_DATA[ch];
    var lv = d && d.j ? String(d.j) : null;
    if (lv && jlptIndex[lv]) jlptIndex[lv].push(ch);
  });
  Object.keys(jlptIndex).forEach(function(lv){
    jlptIndex[lv].sort(function(a,b){
      var sa = (MEANINGS_DATA[a].s||0), sb = (MEANINGS_DATA[b].s||0);
      if (sa !== sb) return sa - sb;
      return a < b ? -1 : (a > b ? 1 : 0);
    });
  });

  var jlptGridEl = document.getElementById("jlptGrid");
  var jlptButtonsEl = document.getElementById("jlptButtons");
  var activeJlptLevel = null;

  function renderJlptGrid(level){
    jlptGridEl.innerHTML = "";
    var list = jlptIndex[level] || [];
    list.forEach(function(ch){
      var b = el("button","jlpt-char", ch);
      b.type = "button";
      b.title = ch;
      b.addEventListener("click", function(){
        document.getElementById("kanjiInput").value = ch;
        runSearch(ch);
        resultsEl.scrollIntoView({behavior:"smooth", block:"start"});
      });
      jlptGridEl.appendChild(b);
    });
  }

  Array.from(jlptButtonsEl.querySelectorAll(".jlpt-btn")).forEach(function(btn){
    var level = btn.getAttribute("data-level");
    var count = (jlptIndex[level] || []).length;
    btn.appendChild(el("span","jlpt-count","("+count+")"));
    btn.addEventListener("click", function(){
      if (activeJlptLevel === level){
        activeJlptLevel = null;
        btn.classList.remove("active");
        jlptGridEl.innerHTML = "";
        return;
      }
      Array.from(jlptButtonsEl.querySelectorAll(".jlpt-btn")).forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      activeJlptLevel = level;
      renderJlptGrid(level);
    });
  });

  // ---------- 즐겨찾기(북마크) ----------
  var BOOKMARK_KEY = "jlptStudyBookmarks";

  function loadBookmarks(){
    try {
      var raw = localStorage.getItem(BOOKMARK_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }
  function saveBookmarks(){
    try {
      localStorage.setItem(BOOKMARK_KEY, JSON.stringify(Array.from(bookmarkSet)));
    } catch (e) { /* 저장 불가(사생활 보호 모드 등) 시 무시 */ }
  }

  var bookmarkSet = new Set(loadBookmarks());

  function isBookmarked(ch){ return bookmarkSet.has(ch); }
  function toggleBookmark(ch){
    if (bookmarkSet.has(ch)) bookmarkSet.delete(ch);
    else bookmarkSet.add(ch);
    saveBookmarks();
  }

  var bookmarkGridEl = document.getElementById("bookmarkGrid");
  var bookmarkToggleBtn = document.getElementById("bookmarkToggleBtn");
  var bookmarkCountEl = document.getElementById("bookmarkCount");
  var bookmarkOpen = false;

  function renderBookmarkGrid(){
    bookmarkGridEl.innerHTML = "";
    var list = Array.from(bookmarkSet).sort(function(a,b){
      var sa = (MEANINGS_DATA[a] && MEANINGS_DATA[a].s) || 0;
      var sb = (MEANINGS_DATA[b] && MEANINGS_DATA[b].s) || 0;
      if (sa !== sb) return sa - sb;
      return a < b ? -1 : (a > b ? 1 : 0);
    });
    if (!list.length){
      bookmarkGridEl.appendChild(el("div","empty-state","즐겨찾기한 한자가 없음. 카드 오른쪽 위 별 아이콘을 클릭해 추가 요망."));
      return;
    }
    list.forEach(function(ch){
      var b = el("button","jlpt-char", ch);
      b.type = "button";
      b.title = ch;
      b.addEventListener("click", function(){
        document.getElementById("kanjiInput").value = ch;
        runSearch(ch);
        resultsEl.scrollIntoView({behavior:"smooth", block:"start"});
      });
      bookmarkGridEl.appendChild(b);
    });
  }

  function refreshBookmarkBar(){
    bookmarkCountEl.textContent = "("+bookmarkSet.size+")";
    if (bookmarkOpen) renderBookmarkGrid();
  }

  bookmarkToggleBtn.addEventListener("click", function(){
    bookmarkOpen = !bookmarkOpen;
    bookmarkToggleBtn.classList.toggle("active", bookmarkOpen);
    if (bookmarkOpen) renderBookmarkGrid();
    else bookmarkGridEl.innerHTML = "";
  });

  refreshBookmarkBar();

  // ---------- 학습 모드(퀴즈) ----------
  var QUIZ_LENGTH = 10;
  var quizPanelEl = document.getElementById("quizPanel");
  var quizToggleBtn = document.getElementById("quizToggleBtn");
  var quizOpen = false;
  var quizState = null;

  function shuffleArray(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function meaningLabel(ch){
    var d = MEANINGS_DATA[ch];
    return (d && d.m && d.m.length) ? d.m[0] : "";
  }

  function quizEligible(list){
    return (list || []).filter(function(ch){ return !!meaningLabel(ch); });
  }

  function renderQuizSetup(){
    quizState = null;
    quizPanelEl.innerHTML = "";
    quizPanelEl.appendChild(el("div","quiz-setup-label","학습할 범위를 선택 요망 (한자를 보고 뜻 맞히기 4지선다, 문제 "+QUIZ_LENGTH+"개)"));
    var row = el("div","quiz-source-buttons");

    function addSourceBtn(label, pool){
      var count = quizEligible(pool).length;
      var b = el("button","jlpt-btn", label+" ("+count+")");
      b.type = "button";
      if (count < 4) b.disabled = true;
      b.addEventListener("click", function(){ startQuiz(pool); });
      row.appendChild(b);
    }
    addSourceBtn("★ 즐겨찾기", Array.from(bookmarkSet));
    addSourceBtn("N5", jlptIndex["5"]);
    addSourceBtn("N4", jlptIndex["4"]);
    addSourceBtn("N3", jlptIndex["3"]);
    addSourceBtn("N2", jlptIndex["2"]);
    addSourceBtn("N1", jlptIndex["1"]);
    quizPanelEl.appendChild(row);
  }

  function startQuiz(pool){
    var eligible = quizEligible(pool);
    if (eligible.length < 4){
      quizPanelEl.innerHTML = "";
      quizPanelEl.appendChild(el("div","empty-state","문제를 만들기에 한자가 부족함(최소 4자 필요). 다른 범위를 선택하거나 즐겨찾기를 더 추가 요망."));
      return;
    }
    var order = shuffleArray(eligible.slice()).slice(0, Math.min(QUIZ_LENGTH, eligible.length));
    quizState = { pool: eligible, order: order, index: 0, score: 0 };
    renderQuizQuestion();
  }

  function quizHeader(progressText){
    var head = el("div","quiz-head");
    head.appendChild(el("div","quiz-progress", progressText));
    var quitBtn = el("button","quiz-quit-btn","범위 다시 선택");
    quitBtn.type = "button";
    quitBtn.addEventListener("click", renderQuizSetup);
    head.appendChild(quitBtn);
    return head;
  }

  function renderQuizQuestion(){
    var ch = quizState.order[quizState.index];
    var correctLabel = meaningLabel(ch);
    var candidates = shuffleArray(quizState.pool.filter(function(c){
      return c !== ch && meaningLabel(c) !== correctLabel;
    }));
    var distractors = candidates.slice(0, 3);
    var options = shuffleArray([correctLabel].concat(distractors.map(meaningLabel)));

    quizPanelEl.innerHTML = "";
    quizPanelEl.appendChild(quizHeader((quizState.index + 1) + " / " + quizState.order.length + "   맞음 " + quizState.score + "개"));

    var qWrap = el("div","quiz-question");
    qWrap.appendChild(buildCell(ch, false, false));
    quizPanelEl.appendChild(qWrap);

    var choicesWrap = el("div","quiz-choices");
    options.forEach(function(label){
      var btn = el("button","quiz-choice", label);
      btn.type = "button";
      btn.addEventListener("click", function(){ handleQuizAnswer(label, correctLabel, btn, choicesWrap); });
      choicesWrap.appendChild(btn);
    });
    quizPanelEl.appendChild(choicesWrap);
  }

  function handleQuizAnswer(chosenLabel, correctLabel, btnEl, choicesWrap){
    Array.from(choicesWrap.children).forEach(function(b){ b.disabled = true; });
    var correct = chosenLabel === correctLabel;
    if (correct){
      quizState.score++;
      btnEl.classList.add("correct");
    } else {
      btnEl.classList.add("wrong");
      Array.from(choicesWrap.children).forEach(function(b){
        if (b.textContent === correctLabel) b.classList.add("correct");
      });
    }
    var isLast = quizState.index + 1 >= quizState.order.length;
    var nextBtn = el("button","quiz-next-btn", isLast ? "결과 보기" : "다음 문제 →");
    nextBtn.type = "button";
    nextBtn.addEventListener("click", function(){
      quizState.index++;
      if (quizState.index < quizState.order.length) renderQuizQuestion();
      else renderQuizResult();
    });
    quizPanelEl.appendChild(nextBtn);
  }

  function renderQuizResult(){
    var pool = quizState.pool;
    var score = quizState.score, total = quizState.order.length;
    quizPanelEl.innerHTML = "";
    quizPanelEl.appendChild(el("div","quiz-result", total+"문제 중 "+score+"개 정답 ("+Math.round(score/total*100)+"%)"));
    var actions = el("div","quiz-result-actions");
    var retryBtn = el("button","quiz-choice","같은 범위로 다시 풀기");
    retryBtn.type = "button";
    retryBtn.addEventListener("click", function(){ startQuiz(pool); });
    var changeBtn = el("button","quiz-choice","범위 다시 선택");
    changeBtn.type = "button";
    changeBtn.addEventListener("click", renderQuizSetup);
    actions.appendChild(retryBtn);
    actions.appendChild(changeBtn);
    quizPanelEl.appendChild(actions);
  }

  quizToggleBtn.addEventListener("click", function(){
    quizOpen = !quizOpen;
    quizToggleBtn.classList.toggle("active", quizOpen);
    if (quizOpen) renderQuizSetup();
    else { quizPanelEl.innerHTML = ""; quizState = null; }
  });

  // 데이터 내장형: 별도 로딩 없이 즉시 사용 가능
  statusEl.textContent = "준비 완료(오프라인 내장 데이터, 상용·교육한자 중심 약 3400자 수록). 한자 입력 후 분해 버튼 클릭 요망.";
  document.getElementById("kanjiInput").focus();

})();
</script>
</body>
</html>
